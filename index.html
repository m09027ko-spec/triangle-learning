<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>分数の大きさくらべ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{background:#0f172a;color:#e2e8f0;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;max-width:430px;margin:0 auto;min-height:100vh;}
.header{background:#0f172a;padding:16px 16px 14px;border-bottom:1px solid #1e293b;}
.header-top{display:flex;align-items:center;gap:10px;}
.logo{width:36px;height:36px;background:linear-gradient(135deg,#f59e0b,#ef4444);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0;}
.title{font-weight:700;font-size:15px;}
.subtitle{font-size:11px;color:#64748b;margin-top:2px;}
.content{padding:16px 14px 40px;}
.step-pill{display:inline-block;background:#1e3a5f;color:#7dd3fc;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;margin-bottom:10px;letter-spacing:.05em;}
.qbox{background:#1e293b;border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:14px;font-weight:600;line-height:1.7;border:1px solid #334155;}
.svg-wrap{background:#0d1b2e;border-radius:14px;border:1px solid #1e3a5f;overflow:hidden;margin-bottom:14px;padding:14px 12px 10px;}
svg{display:block;width:100%;}
.row{display:flex;gap:8px;margin-bottom:10px;}
.opt{flex:1;background:#1e293b;border:1.5px solid #334155;border-radius:10px;padding:14px 8px;font-family:inherit;font-size:14px;font-weight:700;color:#e2e8f0;cursor:pointer;line-height:1.4;}
.opt:active{transform:scale(.98);}
.opt.ok{border-color:#10b981;background:#052e1e;color:#6ee7b7;}
.opt.ng{border-color:#ef4444;background:#2a0a0a;color:#fca5a5;}
.opt:disabled{cursor:default;}
.action-btn{width:100%;border:none;border-radius:10px;padding:14px;font-size:15px;font-family:inherit;cursor:pointer;font-weight:700;color:#fff;background:#2563eb;margin-bottom:10px;}
.action-btn:active{transform:scale(.99);}
.action-btn.ghost{background:#1e293b;border:1px solid #334155;color:#94a3b8;font-weight:600;font-size:13px;}
.exp-box{border-radius:12px;padding:13px 14px;margin-bottom:14px;font-size:13px;line-height:1.8;}
.exp-box.ok{background:#052e1e;border:1px solid #10b981;color:#a7f3d0;}
.exp-box.ng{background:#2a0a0a;border:1px solid #ef4444;color:#fecaca;}
.exp-box.info{background:#0c2040;border:1px solid #1e4080;color:#bfdbfe;}
.key-msgs{background:#1a1330;border:1px solid #4c1d95;border-radius:12px;padding:14px 16px;margin-bottom:14px;}
.key-msgs h3{font-size:12px;color:#c4b5fd;font-weight:700;margin-bottom:8px;letter-spacing:.05em;}
.key-msgs ul{list-style:none;}
.key-msgs li{font-size:13px;line-height:1.8;color:#ddd6fe;padding-left:18px;position:relative;}
.key-msgs li::before{content:'◆';position:absolute;left:0;color:#a78bfa;}
.tag{display:inline-block;background:#1e3a5f;color:#7dd3fc;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-right:6px;}
.tag.g{background:#064e3b;color:#6ee7b7;}
.compare-line{display:flex;align-items:center;justify-content:center;gap:14px;font-family:'Hiragino Mincho','Noto Serif JP',serif;font-size:22px;font-weight:700;margin:6px 0 4px;}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;font-family:'Hiragino Mincho','Noto Serif JP',serif;}
.frac .num{font-size:.85em;}
.frac .bar{width:1.4em;height:2px;background:currentColor;margin:2px 0;}
.frac .den{font-size:.85em;}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div class="logo">½</div>
    <div>
      <div class="title">分数の大きさくらべ</div>
      <div class="subtitle">1/2 と 2/3 はどちらが大きい？</div>
    </div>
  </div>
</div>
<div class="content" id="app"></div>

<script>
// ===== State =====
// step: 1=予想, 2=予想結果, 3=同じ分け方に, 4=結論
let step = 1;
let pick = null;        // 'A' | 'B' | 'C'
let splitProgress = 0;  // 0..1（0=分けない, 1=6等分にした）
let animTimer = null;

const W = 320, H = 70;          // 1本のバーのサイズ
const PAD = 10;
const BAR_W = W - PAD*2;
const BAR_H = 36;
const BAR_Y = (H - BAR_H)/2;

const COLOR = {
  half:  { fill: '#3b82f6', bg: '#0c2040', line: '#60a5fa' },  // 1/2
  third: { fill: '#10b981', bg: '#052e2a', line: '#34d399' },  // 2/3
};

function frac(n, d){ return `<span class="frac"><span class="num">${n}</span><span class="bar"></span><span class="den">${d}</span></span>`; }

// ===== Bar drawer =====
// numerator/denominator: 表示する分数。targetSplit: 表示上の分割数(6等分に向けて変化)
function drawBar(label, num, den, color, targetSplitDen){
  const filled = (num/den) * BAR_W;
  // 線の数: den と targetSplitDen の補間で表現する整数本数
  // 視覚的には「den等分」→「targetSplitDen等分」へ補間
  // splitProgress で何本見せるかを決める
  const baseLines = den - 1;          // den等分にするための内部線
  const finalLines = targetSplitDen - 1;
  const showLines = Math.round(baseLines + (finalLines - baseLines) * splitProgress);

  let lines = '';
  // 等間隔で showLines 本引く
  for (let i = 1; i <= showLines; i++){
    const x = PAD + (BAR_W * i) / (showLines + 1);
    lines += `<line x1="${x}" y1="${BAR_Y}" x2="${x}" y2="${BAR_Y+BAR_H}" stroke="${color.bg === '#0c2040' ? '#0d1b2e' : '#0d1b2e'}" stroke-width="2"/>`;
  }

  // フル長の枠
  const frame = `<rect x="${PAD}" y="${BAR_Y}" width="${BAR_W}" height="${BAR_H}" fill="${color.bg}" stroke="${color.line}" stroke-width="1.5" rx="4"/>`;
  // 塗り
  const fill = `<rect x="${PAD}" y="${BAR_Y}" width="${filled}" height="${BAR_H}" fill="${color.fill}" rx="4"/>`;

  // ラベル
  const labelText = `<text x="${PAD}" y="${H-2}" fill="#94a3b8" font-size="11" font-family="monospace">${label}</text>`;

  return `<svg viewBox="0 0 ${W} ${H+8}" preserveAspectRatio="xMidYMid meet">${frame}${fill}${lines}${labelText}</svg>`;
}

function drawBars(){
  // step1,2: それぞれ自前の分け方 (1/2 → 2分割, 2/3 → 3分割)
  // step3,4: 6分割へ
  const targetDen = step >= 3 ? 6 : null;
  const t1 = targetDen ?? 2;  // 1/2用
  const t2 = targetDen ?? 3;  // 2/3用

  // 表示する分子/分母（step3,4 は 3/6 と 4/6 を見せる）
  const showAsSix = step >= 3 && splitProgress > 0.5;

  const labelHalf  = showAsSix ? '1/2 ＝ 3/6' : '1/2';
  const labelThird = showAsSix ? '2/3 ＝ 4/6' : '2/3';

  return `
    <div style="margin-bottom:8px">${drawBar(labelHalf, 1, 2, COLOR.half, t1)}</div>
    <div>${drawBar(labelThird, 2, 3, COLOR.third, t2)}</div>
  `;
}

// ===== Animation =====
function animateSplit(){
  cancelAnimationFrame(animTimer);
  const start = performance.now();
  const dur = 1100;
  function tick(now){
    const p = Math.min(1, (now - start)/dur);
    splitProgress = 1 - Math.pow(1 - p, 3); // easeOutCubic
    render();
    if (p < 1) animTimer = requestAnimationFrame(tick);
  }
  animTimer = requestAnimationFrame(tick);
}

// ===== Steps =====
function pickAnswer(c){
  if (pick) return;
  pick = c;
  step = 2;
  render();
}

function goSplit(){
  step = 3;
  splitProgress = 0;
  render();
  animateSplit();
}

function goConclude(){
  step = 4;
  render();
}

function reset(){
  step = 1; pick = null; splitProgress = 0;
  cancelAnimationFrame(animTimer);
  render();
}

// ===== Render =====
function render(){
  const app = document.getElementById('app');
  let html = '';

  // --- 共通: バー表示 ---
  html += `<div class="svg-wrap">${drawBars()}</div>`;

  if (step === 1){
    html += `<div class="step-pill">STEP 1 ／ 予想</div>`;
    html += `<div class="qbox">青のバーは ${frac(1,2)}、緑のバーは ${frac(2,3)} を表しています。<br>同じ長さの「1」を、ちがう分け方で取りました。<br>どちらが大きいでしょう？</div>`;
    html += `<div class="row">
      <button class="opt" onclick="pickAnswer('A')">${frac(1,2)}<br>のほう</button>
      <button class="opt" onclick="pickAnswer('B')">${frac(2,3)}<br>のほう</button>
      <button class="opt" onclick="pickAnswer('C')">同じ</button>
    </div>`;
    html += `<div class="exp-box info">まずは目で見て予想してみよう。正解はこのあと確かめます。</div>`;
  }

  else if (step === 2){
    const correct = 'B';
    const ok = pick === correct;
    html += `<div class="step-pill">STEP 2 ／ くらべにくい？</div>`;
    html += `<div class="row">
      <button class="opt ${pick==='A'?(ok?'ok':'ng'):''}" disabled>${frac(1,2)}<br>のほう</button>
      <button class="opt ${pick==='B'?'ok':(correct==='B'?'':'')}" disabled>${frac(2,3)}<br>のほう</button>
      <button class="opt ${pick==='C'?(ok?'ok':'ng'):''}" disabled>同じ</button>
    </div>`;
    html += `<div class="exp-box info">
      <strong>「分け方」がちがうと、くらべにくいね。</strong><br>
      ${frac(1,2)} は 1 を <b>2</b> に分けた 1つ分。<br>
      ${frac(2,3)} は 1 を <b>3</b> に分けた 2つ分。<br>
      分け方がそろっていないので、ぱっと見ではくらべにくい。
    </div>`;
    html += `<button class="action-btn" onclick="goSplit()">同じ分け方にしてみる →</button>`;
  }

  else if (step === 3){
    html += `<div class="step-pill">STEP 3 ／ 同じ分け方にそろえる</div>`;
    html += `<div class="exp-box info">
      ${frac(1,2)} のバーを <b>もっと細かく 6</b> に分けてみる。<br>
      ${frac(2,3)} のバーも <b>同じく 6</b> に分けてみる。<br>
      <span style="color:#fbbf24">分け方は変わっても、塗ってある<strong>量は変わらない</strong>よ。</span>
    </div>`;
    html += `<div class="qbox">
      ${frac(1,2)} ＝ <span style="color:#60a5fa">${frac(3,6)}</span>（6つに分けた 3つ分）<br>
      ${frac(2,3)} ＝ <span style="color:#34d399">${frac(4,6)}</span>（6つに分けた 4つ分）
    </div>`;
    html += `<button class="action-btn" onclick="goConclude()">どちらが大きい？ →</button>`;
    html += `<button class="action-btn ghost" onclick="reset()">最初からやりなおす</button>`;
  }

  else if (step === 4){
    const userOk = pick === 'B';
    html += `<div class="step-pill">STEP 4 ／ こたえ</div>`;
    html += `<div class="compare-line">
      <span style="color:#60a5fa">${frac(3,6)}</span>
      <span style="color:#fbbf24;font-size:28px">＜</span>
      <span style="color:#34d399">${frac(4,6)}</span>
    </div>`;
    html += `<div class="qbox" style="text-align:center">
      つまり <span style="color:#60a5fa">${frac(1,2)}</span> ＜ <span style="color:#34d399">${frac(2,3)}</span><br>
      <span style="font-size:13px;color:#94a3b8;font-weight:500">${frac(2,3)} のほうが大きい！</span>
    </div>`;
    html += `<div class="exp-box ${userOk ? 'ok' : 'ng'}">
      ${userOk
        ? '✅ 予想どおり、'+'<b>2/3 のほうが大きい</b>でした！'
        : '🤔 予想とちがった人も大丈夫。<b>目で見ただけだと迷う</b>のがふつう。だから「同じ分け方にそろえる」んだね。'}
    </div>`;
    html += `<div class="key-msgs">
      <h3>★ 今日のたいせつなこと</h3>
      <ul>
        <li>分数は、<b>同じ 1 をどれだけ取ったか</b>でくらべる</li>
        <li>分け方がちがうと <b>くらべにくい</b></li>
        <li>同じ分け方にそろえると <b>くらべやすい</b></li>
        <li><span class="tag">通分</span>は、分数をくらべるための<b>「見える化」</b></li>
      </ul>
    </div>`;
    html += `<button class="action-btn ghost" onclick="reset()">もう一度やってみる</button>`;
  }

  app.innerHTML = html;
}

render();
</script>
</body>
</html>
